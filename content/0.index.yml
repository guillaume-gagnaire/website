sections:
  - headline: Ce que je fais
    title: Des produits livrés, pas des slides
    description: "Startups early-stage ou grands comptes, la méthode ne change pas : comprendre le métier, cadrer, livrer vite, puis itérer sur ce qui sert vraiment le business."
    id: realisations
    align: left
    features:
      - name: Du cadrage à la production
        description: "Je prends le sujet au début, avec les gens du métier, et je le tiens jusqu'au déploiement : architecture, développement, mise en production, puis suivi de ce qui tourne."
        icon: i-heroicons-map
      - name: Seul ou en encadrant
        description: "Je sais porter un produit entier tout seul, comme chez Smart Moov, et faire monter des juniors quand une équipe existe."
        icon: i-heroicons-users
      - name: Un design mesuré, annoncé comme tel
        description: "Je fais les maquettes et les design systems quand il le faut : celui de Bordeaux Métropole Énergies leur sert encore aujourd'hui. Ce n'est pas mon métier premier, mais ça tient."
        icon: i-heroicons-paint-brush
    stats:
      - value: 9
        label: applications métier livrées chez un assureur
      - value: 50
        label: clients en production sur une plateforme RH
      - value: 15 ans
        label: à concevoir et développer des produits web
  - headline: Ma façon de travailler
    title: "L'IA au quotidien, le business en ligne de mire"
    description: "Je développe désormais en full IA, et je diffuse ces pratiques dans les équipes. Ce qui compte reste le même : trouver ce qui fait avancer le business, par l'automatisation, la simplification ou de nouveaux usages."
    align: right
    features:
      - name: Je développe en full IA
        description: "Chez Groupama Gan Vie, je travaille en full IA avec Claude Code au quotidien, sur des projets métier entiers."
        icon: i-heroicons-sparkles
      - name: Le business avant le code
        description: "Assurance, énergie, RH, retail : je me projette très facilement dans un nouveau secteur, et je cherche d'abord là où le code fait gagner du temps ou de l'argent."
        icon: i-heroicons-arrow-trending-up
      - name: Je laisse une équipe plus forte
        description: "Je transmets ce que je sais, en mission comme en cours. Le développeur front que j'ai coaché à Bordeaux Métropole Énergies est aujourd'hui lead front chez eux."
        icon: i-heroicons-academic-cap
    stats:
      - value: 70 000 €
        label: économisés chaque année, en deux semaines de travail
      - value: 3 fois
        label: CTO, chez UrDoor, Noci.io et Smart Moov
      - value: 35
        label: étudiants formés chaque année à Sup de Pub
features:
  title: Mes compétences
  description: Et j'adore en apprendre plus!
  items:
    - title: Développement fullstack
      description: "Typescript, Vue, Angular, NestJS, Django, PostgreSQL, MariaDB ... je prends la stack du contexte, pas la mienne"
      icon: i-heroicons-code-bracket
    - title: DevOps
      description: CI/CD, Kubernetes, Airflow ❤️
      icon: i-heroicons-server-stack
    - title: Développement full IA
      description: "J'embarque de l'IA dans les produits : OCR, lecture de documents, chatbots qui restent dans leur périmètre 🤖"
      icon: i-heroicons-sparkles
    - title: Transfert de compétences
      description: "J'adore enseigner et transmettre mon expérience, aux juniors comme aux équipes en place 👨‍🏫"
      icon: i-heroicons-academic-cap
    - title: Care
      description: J'aime prendre soin des gens avec qui je travaille 🤗
      icon: i-heroicons-heart
    - title: Vision business
      description: "Le beau code ne sert à rien s'il n'est pas au service du business, en startup comme en grand compte"
      icon: i-heroicons-building-office
testimonials:
  headline: Témoignages
  title: J'ai travaillé avec eux.
  description: Et apparemment, ils sont contents 😊
  items:
    - quote: Cela fait maintenant plus de 6 ans que nous travaillons avec Guillaume, en tant que CTO interne puis externalisé par la suite. Arrivé initialement comme lead dev, il est rapidement devenu notre CTO en nous démontrant toutes ses qualités de tech mais aussi et surtout sa vision transverse, des compétences dans les domaines complémentaires de vision stratégique et des savoirs être qui nous sont chers chez NOCI.io tels que la transparence, l’humanité, et l’adaptabilité. Malgré mes demandes toujours plus poussées Guillaume sait à la fois me canaliser et recentrer/prioriser les évolutions de notre produit afin de le rendre parfaitement adapté aux évolutions technologiques et d’usage.
      author:
        name: Guilhaume FEREGOTTO
        description: CEO @ Noci.io
        avatar:
          src: https://media.licdn.com/dms/image/C4E03AQFs4SVpL18ieA/profile-displayphoto-shrink_800_800/0/1609749143022?e=1719446400&v=beta&t=U7dULDSSy_elbkAMiTlDa2Nq-QzX9BR6hltF6u-xYag
          loading: lazy
    - quote: Guillaume a occupé de manière très investi le rôle de lead dev sur le projet de développement de la data plateforme. C'est un passionné très compétent et soucieux du moindre détail qui fera de votre projet une réussite. Exigence, rigueur et performance sont les qualificatifs qui le caractérisent le mieux. Je recommande son savoir faire sans hésiter.
      author:
        name: Jérome TOSCANO
        description: Head of Data @ Pichet
        avatar:
          src: https://media.licdn.com/dms/image/D4E03AQGJi6rBLlPZHA/profile-displayphoto-shrink_800_800/0/1689745690035?e=1719446400&v=beta&t=N4Ri7QLemVaEhWHZtT_G_SE7UMt2htoWdvDsVyLLK6Q
          loading: lazy
    - quote: J'ai eu le plaisir de travailler avec Guillaume pendant presque 2 ans, d'abord en tant que prestataire puis en CDI au sein de Smart Moov. Guillaume possède un gros bagage technique qui lui permet de toujours trouver des solutions. Il a la capacité de mener des projets complexes de A à Z dans des environnements métiers qu'il découvre. J'ai particulièrement apprécié sa vision terrain et business !
      author:
        name: Léo AL HAMRA
        description: CEO @ Teamtailor
        avatar:
          src: https://media.licdn.com/dms/image/D4E03AQHp_xs-e8BilA/profile-displayphoto-shrink_800_800/0/1684164363087?e=1719446400&v=beta&t=bmGOqHgcIjrKN4cUwYgGp4XKb_QtJvYIkXGsDkH-pGk
          loading: lazy
    - quote: En introduction, Guillaume est tout simplement un CTO exceptionnel et leader technologique. J'ai eu le plaisir de travailler avec lui pendant 2 ans au lancement de Zola, où il a démontré une expertise technique remarquable et une capacité impressionnante à diriger des équipes vers l'atteinte de résultats exceptionnels. Guillaume est un véritable visionnaire technologique. Sa compréhension approfondie des tendances de l'industrie et sa capacité à anticiper les évolutions technologiques lui permettent de prendre des décisions stratégiques éclairées. Il a dirigé la mise en œuvre de solutions innovantes qui ont considérablement amélioré l'efficacité de notre infrastructure technologique. Guillaume excelle également dans la résolution de problèmes techniques complexes et son aptitude à transformer des défis en opportunités a permis à notre entreprise surmonter des obstacles critiques et d'atteindre des résultats exceptionnels, même dans des situations difficiles. En somme, je le recommanderai à toute entreprise à la recherche d'un leader technologique dynamique et compétent. Sa passion pour l'innovation, sa vision stratégique et sa capacité à obtenir des résultats en font un choix idéal pour des projets ambitieux.
      author:
        name: Yanis EL ASLI
        description: Operation Manager @ Zola
        avatar:
          src: https://media.licdn.com/dms/image/D4E03AQGHLKzLyCq-FA/profile-displayphoto-shrink_800_800/0/1684744751884?e=1719446400&v=beta&t=L-Zyq3V6P7zbe0L4vqZ7EX0VWnTfwgfvfojUcXAa-VE
          loading: lazy
    - quote: Guillaume c'est le talent technique dont vous avez besoin. Niveau dev, il excelle. Humainement, c'est le top. Et à cela, il ajoute une vraie connaissance sur les sujets transverses à la tech (design, marketing, ...). Ce n'est pas pour rien que nous continuons à faire appel à lui en tant que Freelance après 3 ans de salariat Noci
      author:
        name: Jonathan PIBOTEAU
        description: Head of Marketing @ Noci.io
        avatar:
          src: https://media.licdn.com/dms/image/C5603AQFGLy-Jpa8-3w/profile-displayphoto-shrink_800_800/0/1609774064337?e=1719446400&v=beta&t=muPt1POLVDagu7lMvQSGbGbdzZ-C_LkxAcqecL1U_Jg
          loading: lazy
    - quote: J'ai eu la chance d'avoir Guillaume en tant que CTO et cette expérience a marqué ma carrière. Très pédagogue et disposant d'un savoir impressionant, Guillaume n'hésite pas à s'impliquer à chaque stade d'un projet, ainsi qu'auprès des développeurs. Ses capacités d'écoute, de compréhension et d'analyse ainsi que sa façon de penser "outside the box" font de lui le leader parfait. Passionné par son métier et d'un professionnalisme exemplaire, il excelle dans la création de projets et travailler avec lui est un réel plaisir. Il est, encore à l'heure actuelle, source d'inspiration dans ma vie professionnelle.
      author:
        name: Alison VANDROMME
        description: CTO @ WeLOOP
        avatar:
          src: https://media.licdn.com/dms/image/C4E03AQHwOAt438OuHA/profile-displayphoto-shrink_800_800/0/1649052916046?e=1719446400&v=beta&t=j9jkZak1ERLulcd_7uCmsYngmfyksxCxTm2ngkl5kZM
          loading: lazy
